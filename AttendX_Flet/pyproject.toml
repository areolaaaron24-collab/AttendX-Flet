[project]
name = "attendx-flet"
version = "1.0.0"
description = "AttendX Smart Attendance System - Flet client with Supabase backend"
requires-python = ">=3.11"
dependencies = [
  "flet[all]>=1.0,<2.0",
  "supabase>=2.15,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "qrcode[pil]>=7.4,<9.0",
  "Pillow>=10.0,<13.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.0,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flet]
product = "AttendX Smart Attendance System"
org = "ph.edu.csu"
bundle_id = "ph.edu.csu.attendx"

[tool.flet.app]
exclude = ["tests", "docs", "scripts", ".pytest_cache", "__pycache__"]
